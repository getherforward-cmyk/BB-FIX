<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BB Fix — ระบบแจ้งซ่อมโรงเรียน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#EFF8F1; --bg-soft:#E4F3E8; --ink:#173821; --ink-soft:#4C6B57; --ink-faint:#7C9686;
    --green-deep:#1F6E43; --green:#4CAF6D; --green-bright:#6BCB84; --green-line:#2E7D4F;
    --amber:#B9791E; --amber-bg:#FCF1DD; --blue:#2E6F96; --blue-bg:#E4F1F8;
    --coral:#D85A34; --coral-bg:#FDE7DE; --white:#FFFFFF; --border:#D8ECDD;
    --shadow:0 4px 16px rgba(31,110,67,0.09); --radius-leaf:22px 22px 22px 6px;
    --font-head:'Mitr',sans-serif; --font-body:'Sarabun',sans-serif;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;}
  .shell{max-width:640px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative;}
  h1,h2,h3{font-family:var(--font-head); margin:0; color:var(--ink); font-weight:600;}
  button{font-family:var(--font-body); cursor:pointer;}
  input,textarea,select{font-family:var(--font-body); font-size:16px;}
  input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:2.5px solid var(--green-deep); outline-offset:2px;}
  a{color:var(--green-deep);}
  .center-screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; text-align:center; gap:18px;}
  .bubble{position:absolute; border-radius:50%; background:radial-gradient(circle at 32% 30%, rgba(255,255,255,0.85), rgba(107,203,132,0.18)); z-index:0;}
  .brand-title{font-size:34px; letter-spacing:0.5px; color:var(--green-deep);}
  .brand-tagline{color:var(--ink-soft); font-size:15px; max-width:280px; margin-top:-6px;}
  .onboard-card{position:relative; z-index:1; background:var(--white); border-radius:26px 26px 26px 8px; box-shadow:var(--shadow); padding:28px 24px; width:100%; max-width:340px;}
  .field-label{display:block; text-align:left; font-size:14px; color:var(--ink-soft); margin:0 0 6px 4px;}
  .text-input{width:100%; padding:13px 14px; border-radius:14px; border:1.5px solid var(--border); background:var(--bg); color:var(--ink);}
  .text-input:focus-visible{border-color:var(--green-deep);}
  .btn{border:none; border-radius:16px; padding:14px 20px; font-size:16px; font-weight:600; font-family:var(--font-head); transition:transform .12s ease;}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--green-deep); color:#fff; width:100%;}
  .btn-primary:disabled{opacity:0.55; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--green-deep); border:1.5px solid var(--green-deep);}
  .role-btn{position:relative; z-index:1; display:flex; align-items:center; gap:14px; width:100%; max-width:340px; background:var(--white); border:1.5px solid var(--border); border-radius:var(--radius-leaf); padding:16px 18px; text-align:right; box-shadow:var(--shadow);}
  .role-btn .rb-icon{font-size:26px; width:44px; height:44px; background:var(--bg-soft); border-radius:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .role-btn .rb-text{flex:1; text-align:right;}
  .role-btn .rb-title{font-family:var(--font-head); font-weight:600; font-size:16px; color:var(--ink);}
  .role-btn .rb-sub{font-size:13px; color:var(--ink-faint); margin-top:2px;}
  .role-list{position:relative; z-index:1; display:flex; flex-direction:column; gap:12px; width:100%; max-width:340px;}
  .small-link{background:none; border:none; color:var(--ink-faint); font-size:13px; text-decoration:underline; padding:4px;}
  .topbar{display:flex; align-items:center; gap:12px; padding:16px 18px; background:var(--white); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;}
  .back-btn{background:var(--bg-soft); border:none; width:36px; height:36px; border-radius:11px; font-size:18px; color:var(--green-deep); flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .topbar-title{flex:1;}
  .topbar-title .tt-main{font-family:var(--font-head); font-size:17px; font-weight:600;}
  .topbar-title .tt-sub{font-size:12.5px; color:var(--ink-faint);}
  .topbar .logo-mini{flex-shrink:0;}
  .tabs{display:flex; gap:8px; padding:12px 18px 0; background:var(--white);}
  .tab-btn{flex:1; border:none; background:var(--bg-soft); color:var(--ink-soft); padding:10px 8px; border-radius:12px 12px 0 0; font-family:var(--font-head); font-size:14px; font-weight:500;}
  .tab-btn.active{background:var(--bg); color:var(--green-deep); font-weight:600;}
  .content{padding:18px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{display:flex; align-items:center; gap:6px; border:1.5px solid var(--border); background:var(--white); color:var(--ink-soft); padding:9px 13px; border-radius:30px; font-size:14px;}
  .chip-icon{font-size:15px;}
  .chip-active{border-color:var(--green-deep); background:var(--green-deep); color:#fff;}
  .form-block{margin-bottom:18px;}
  textarea.text-input{resize:vertical; min-height:90px;}
  .img-strip{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;}
  .img-thumb{position:relative; width:68px; height:68px; border-radius:14px; overflow:hidden; border:1.5px solid var(--border);}
  .img-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .img-remove{position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%; background:rgba(23,56,33,0.75); color:#fff; border:none; font-size:13px; line-height:1; display:flex; align-items:center; justify-content:center;}
  .attach-btn{display:inline-flex; align-items:center; gap:8px; background:var(--bg-soft); border:1.5px dashed var(--green); color:var(--green-deep); padding:10px 14px; border-radius:14px; font-size:14px; margin-top:10px;}
  .attach-btn input{display:none;}
  .form-error{color:var(--coral); font-size:14px; margin-top:8px;}
  .case-card{display:flex; gap:12px; background:var(--white); border-radius:var(--radius-leaf); padding:14px; box-shadow:var(--shadow); border-left:5px solid var(--amber); margin-bottom:12px; text-align:right; width:100%;}
  .case-card.status-in_progress{border-left-color:var(--blue);}
  .case-card.status-done{border-left-color:var(--coral);}
  .case-thumb{width:56px; height:56px; border-radius:13px; flex-shrink:0; object-fit:cover; background:var(--bg-soft);}
  .case-thumb-fallback{width:56px; height:56px; border-radius:13px; flex-shrink:0; background:var(--bg-soft); display:flex; align-items:center; justify-content:center; font-size:22px;}
  .case-body{flex:1; min-width:0;}
  .case-title{font-family:var(--font-head); font-weight:600; font-size:15.5px; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .case-meta{font-size:12.5px; color:var(--ink-faint); margin-bottom:6px;}
  .status-badge{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; padding:4px 10px; border-radius:20px;}
  .status-new{background:var(--amber-bg); color:var(--amber);}
  .status-in_progress{background:var(--blue-bg); color:var(--blue);}
  .status-done{background:var(--coral-bg); color:var(--coral);}
  .case-time{font-size:11.5px; color:var(--ink-faint); margin-top:6px;}
  .case-card-btn{border:none; background:none; padding:0; width:100%; display:block;}
  .stat-row{display:flex; gap:10px; margin-bottom:16px;}
  .stat-chip{flex:1; background:var(--white); border:1.5px solid var(--border); border-radius:16px; padding:12px 8px; text-align:center;}
  .stat-chip.active{border-color:var(--green-deep); background:var(--bg-soft);}
  .stat-num{font-family:var(--font-head); font-size:20px; font-weight:700; color:var(--ink);}
  .stat-label{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .search-box{margin-bottom:14px;}
  .empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; padding:40px 20px; color:var(--ink-faint);}
  .empty-state h3{margin:14px 0 4px; color:var(--ink-soft); font-size:16px;}
  .empty-state p{font-size:13.5px; margin:0;}
  .overlay{position:fixed; inset:0; background:var(--bg); z-index:50; overflow-y:auto; max-width:640px; margin:0 auto; box-shadow:0 0 40px rgba(0,0,0,0.15);}
  .detail-header{display:flex; align-items:flex-start; gap:12px; padding:16px 18px; background:var(--white); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5;}
  .detail-cat{font-size:22px; background:var(--bg-soft); width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .detail-title{font-size:18px; margin-bottom:4px;}
  .detail-sub{font-size:13px; color:var(--ink-faint);}
  .section-title{font-family:var(--font-head); font-size:14.5px; font-weight:600; color:var(--green-deep); margin:22px 0 10px;}
  .desc-box{background:var(--white); border-radius:var(--radius-leaf); padding:14px; font-size:15px; color:var(--ink); white-space:pre-wrap;}
  .gallery{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .gallery img{width:104px; height:104px; object-fit:cover; border-radius:13px; border:1.5px solid var(--border);}
  .update-card{background:var(--white); border-radius:16px; padding:12px 14px; margin-bottom:10px; border:1px solid var(--border); border-left:5px solid var(--border);}
  .update-card.role-staff{border-left-color:var(--green-deep); background:var(--bg-soft);}
  .update-card.role-reporter{border-left-color:#C7A94E; background:#FBF7EA;}
  .update-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; flex-wrap:wrap; gap:6px;}
  .update-tag{display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:700; padding:5px 11px; border-radius:20px;}
  .tag-staff{background:var(--green-deep); color:#fff;}
  .tag-reporter{background:#C7A94E; color:#fff;}
  .update-time{font-size:11.5px; color:var(--ink-faint);}
  .update-text{font-size:14.5px; color:var(--ink); white-space:pre-wrap;}
  .divider-note{font-size:12.5px; color:var(--ink-faint); text-align:center; margin:14px 0;}
  .action-row{display:flex; gap:10px; margin:14px 0;}
  .action-row .btn{flex:1; font-size:14px; padding:12px;}
  .reply-box{background:var(--white); border-radius:var(--radius-leaf); padding:14px; margin-top:10px; border:1px solid var(--border);}
  .status-select-row{display:flex; gap:8px; margin-bottom:12px;}
  .status-opt{flex:1; text-align:center; border:1.5px solid var(--border); border-radius:13px; padding:9px 4px; font-size:13px; background:var(--white); color:var(--ink-soft);}
  .status-opt.sel-new.active{border-color:var(--amber); background:var(--amber-bg); color:var(--amber); font-weight:600;}
  .status-opt.sel-in_progress.active{border-color:var(--blue); background:var(--blue-bg); color:var(--blue); font-weight:600;}
  .status-opt.sel-done.active{border-color:var(--coral); background:var(--coral-bg); color:var(--coral); font-weight:600;}
  .bottom-space{height:30px;}
  .loading-line{text-align:center; color:var(--ink-faint); font-size:14px; padding:30px 0;}
  .badge-live{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--green-deep);}
  .dot-live{width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block;}
  .toast-overlay{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:200; pointer-events:none; padding:20px;}
  .toast-card{background:rgba(23,56,33,0.94); color:#fff; padding:24px 30px; border-radius:22px; display:flex; flex-direction:column; align-items:center; gap:10px; animation:toastPop .25s ease; max-width:260px; text-align:center;}
  .toast-check{width:60px; height:60px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .toast-text{font-family:var(--font-head); font-size:16px; font-weight:600;}
  @keyframes toastPop{ from{ transform:scale(0.75); opacity:0;} to{ transform:scale(1); opacity:1;} }
  .gallery-item{border:none; padding:0; background:none; cursor:pointer; display:block;}
  .lightbox-overlay{position:fixed; inset:0; background:rgba(10,20,14,0.93); z-index:300; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:22px; gap:16px;}
  .lightbox-img{max-width:92vw; max-height:64vh; border-radius:16px; object-fit:contain; box-shadow:0 10px 30px rgba(0,0,0,0.4); display:block;}
  .lightbox-actions{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}
  .lightbox-btn{background:#fff; color:var(--green-deep); border:none; border-radius:14px; padding:12px 22px; font-family:var(--font-head); font-weight:600; font-size:14px; text-decoration:none; display:inline-flex; align-items:center; gap:6px;}
  .lightbox-btn.ghost{background:rgba(255,255,255,0.14); color:#fff;}
  .lightbox-close{position:absolute; top:18px; right:18px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.16); border:none; color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center;}
  .star-row{display:flex; gap:6px; justify-content:center;}
  .star-btn{background:none; border:none; font-size:34px; line-height:1; color:var(--amber); padding:2px;}
  .star-row.static{font-size:26px; color:var(--amber); gap:3px;}

  /* ---------- desktop / wide screens ---------- */
  @media (min-width:860px){
    body{background:#D7E9DB;}
    .shell{
      max-width:760px; background:var(--bg);
      box-shadow:0 0 0 1px rgba(31,110,67,.06),0 24px 60px rgba(31,110,67,.16);
      margin:28px auto; min-height:calc(100vh - 56px); border-radius:24px; overflow:hidden;
    }
    .overlay{
      max-width:760px; top:28px; bottom:28px; height:auto;
      border-radius:24px; box-shadow:0 0 0 1px rgba(31,110,67,.06),0 24px 60px rgba(31,110,67,.22);
    }
  }
</style>
</head>

/* ============ Data & helpers ============ */
const CATEGORIES = [
  {key:'electric', label:'ไฟฟ้า/ประปา', icon:'⚡'},
  {key:'clean', label:'ความสะอาด', icon:'🧹'},
  {key:'broken', label:'อุปกรณ์ชำรุด', icon:'🔧'},

  new:{label:'รอดำเนินการ', cls:'status-new', icon:'🌱'},
  in_progress:{label:'กำลังดำเนินการ', cls:'status-in_progress', icon:'🔧'},
  done:{label:'เสร็จเรียบร้อย', cls:'status-done', icon:'✅'}
};

function genId(){ return 'c_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function timeAgo(iso){
  const diff = (Date.now() - new Date(iso).getTime())/1000;
  if(diff<60) return 'เมื่อสักครู่';
  if(diff<3600) return Math.floor(diff/60)+' นาทีที่แล้ว';
  if(diff<86400) return Math.floor(diff/3600)+' ชั่วโมงที่แล้ว';
  if(diff<86400*7) return Math.floor(diff/86400)+' วันที่แล้ว';
  return new Date(iso).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
}
function fullDate(iso){
  return new Date(iso).toLocaleString('th-TH',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
let _logoIdSeq = 0;

function resizeImage(file, maxDim, quality){
  maxDim = maxDim||820; quality = quality||0.65;
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('image decode failed'));
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============ Render engine (focus-preserving) ============ */
let _scrollPinTimer=null, _scrollPinRAF=null, _scrollPinUntil=0;
function applyScroll(x,y,overlayTop){
  window.scrollTo(x,y);
  if(overlayTop!=null){
    // The overlay div is destroyed and recreated on every render, so its
    // scrollTop always starts at 0 on the new node — re-query it fresh
    // each time and re-apply the saved position.
    const ov = document.querySelector('#app .overlay');
    if(ov) ov.scrollTop = overlayTop;
  }
}
function pinScroll(x,y,overlayTop){
  // Re-apply the scroll position repeatedly for a short window to survive
  // delayed reflows caused by the mobile keyboard closing (common in
  // in-app browsers like LINE) after an async save completes.
  if(_scrollPinTimer) clearInterval(_scrollPinTimer);
  if(_scrollPinRAF) cancelAnimationFrame(_scrollPinRAF);
  _scrollPinUntil = Date.now() + 700;
  const tick=()=>{
    applyScroll(x,y,overlayTop);
    if(Date.now() < _scrollPinUntil){ _scrollPinRAF = requestAnimationFrame(tick); }
  };
  tick();
  _scrollPinTimer = setInterval(()=>applyScroll(x,y,overlayTop), 60);
  setTimeout(()=>{ if(_scrollPinTimer){ clearInterval(_scrollPinTimer); _scrollPinTimer=null; } }, 700);
  const vv = window.visualViewport;
  if(vv){
    const onVV=()=>applyScroll(x,y,overlayTop);
    vv.addEventListener('resize', onVV);
    setTimeout(()=>vv.removeEventListener('resize', onVV), 700);
  }
}
function render(){
  const app = document.getElementById('app');
  const active = document.activeElement;
  let focusId=null, selStart=null, selEnd=null;
  if(active && active.id && app.contains(active)){
    focusId = active.id;
    if('selectionStart' in active){ try{ selStart=active.selectionStart; selEnd=active.selectionEnd; }catch(e){} }
  }
  const scrollX = window.scrollX, scrollY = window.scrollY;
  const existingOverlay = app.querySelector('.overlay');
  const overlayTop = existingOverlay ? existingOverlay.scrollTop : null;
  app.innerHTML = screenHtml() + toastHtml() + lightboxHtml();
  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus({preventScroll:true});
      if(selStart!=null && 'setSelectionRange' in el){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
  applyScroll(scrollX, scrollY, overlayTop);
  pinScroll(scrollX, scrollY, overlayTop);
}

function filteredStaffCases(){
  const f = state.staffFilter;
  const q = f.q.trim().toLowerCase();
  return state.cases.filter(c=>{
    if(!f.showHidden && c.hidden) return false;
    if(f.status!=='all' && c.status!==f.status) return false;
    if(f.category!=='all' && c.category!==f.category) return false;
    if(f.mineOnly && c.assignedTo!==state.me.name) return false;

  });

/* ============ Analytics helpers ============ */
function categoryBreakdown(cases){
  const counts = {}; CATEGORIES.forEach(c=>counts[c.key]=0);
  cases.forEach(c=>{ counts[c.category] = (counts[c.category]||0) + 1; });
  return counts;
}
function polarToCartesian(cx,cy,r,angleDeg){
  const rad = (angleDeg-90)*Math.PI/180;
  return {x: cx+r*Math.cos(rad), y: cy+r*Math.sin(rad)};
}
function describeSlice(cx,cy,r,startAngle,endAngle){
  const s = polarToCartesian(cx,cy,r,startAngle);
  const e = polarToCartesian(cx,cy,r,endAngle);
  const largeArc = (endAngle-startAngle) > 180 ? 1 : 0;
  return `M ${cx} ${cy} L ${s.x.toFixed(2)} ${s.y.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${e.x.toFixed(2)} ${e.y.toFixed(2)} Z`;
}
function pieChartSvg(counts, total){
  if(total<=0) return '';
  let angle = 0;
  let slices = '';
  CATEGORIES.forEach(cat=>{
    const val = counts[cat.key]||0;
    if(val<=0) return;
    const sweep = val/total*360;
    const end = angle+sweep;
    slices += `<path d="${describeSlice(100,100,90,angle,end)}" fill="${CAT_CHART_COLORS[cat.key]}"/>`;
    angle = end;
  });
  return `<svg viewBox="0 0 200 200" width="180" height="180">${slices}<circle cx="100" cy="100" r="46" fill="var(--white)"/><text x="100" y="94" text-anchor="middle" font-family="Mitr,sans-serif" font-weight="700" font-size="30" fill="var(--ink)">${total}</text><text x="100" y="116" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="13" fill="var(--ink-faint)">เคสทั้งหมด</text></svg>`;
}
function periodKey(iso, mode){
  const d = new Date(iso);
  if(mode==='week'){
    const onejan = new Date(d.getFullYear(),0,1);
    const week = Math.ceil((((d-onejan)/86400000) + onejan.getDay()+1)/7);
    return d.getFullYear()+'-W'+String(week).padStart(2,'0');
  }
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function periodLabel(key, mode){
  if(mode==='week'){ const parts = key.split('-W'); return 'สัปดาห์ '+parseInt(parts[1],10)+'/'+parts[0].slice(2); }
  const parts = key.split('-');
  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return months[parseInt(parts[1],10)-1]+' '+parts[0].slice(2);
}
function trendData(cases, mode){
  const periods = 6;
  const now = new Date();
  const keys = [];
  for(let i=periods-1;i>=0;i--){
    const d = new Date(now);
    if(mode==='week') d.setDate(d.getDate()-i*7); else d.setMonth(d.getMonth()-i);
    keys.push(periodKey(d.toISOString(), mode));
  }
  const counts = {}; keys.forEach(k=>counts[k]=0);
  cases.forEach(c=>{ const k = periodKey(c.createdAt, mode); if(counts[k]!=null) counts[k]++; });
  return keys.map(k=>({key:k, label:periodLabel(k,mode), count:counts[k]}));
}
function staffPerformance(cases){
  const map = {};
  cases.forEach(c=>{
    if(c.rating && c.resolvedBy){
      if(!map[c.resolvedBy]) map[c.resolvedBy] = {name:c.resolvedBy, total:0, count:0};
      map[c.resolvedBy].total += c.rating;
      map[c.resolvedBy].count += 1;
    }
  });
  return Object.values(map).map(x=>({name:x.name, count:x.count, avg: x.total/x.count})).sort((a,b)=>b.avg-a.avg);
}
function starsDisplay(avg){
  const rounded = Math.round(avg);
  return [1,2,3,4,5].map(n=>n<=rounded?'★':'☆').join('');
}

/* ============ CSV export ============ */
function csvEscape(val){
  const s = String(val==null?'':val);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function exportCasesToCSV(cases){
  const headers = ['รหัสเคส','หัวข้อ','หมวดหมู่','สถานที่','รายละเอียด','ผู้แจ้ง','สถานะ','ผู้รับผิดชอบ','แจ้งเมื่อ','คะแนน'];
  const rows = cases.map(c=>[
    c.id, c.title, (CAT_MAP[c.category]||{label:c.category}).label, c.location||'',
    c.description||'', c.reporterName||'', (STATUS_META[c.status]||{label:c.status}).label,
    c.assignedTo||'', fullDate(c.createdAt), c.rating||''
  ]);
  const csv = [headers, ...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'bb-fix-เคส-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* ============ Detail overlay ============ */
function detailOverlay(role){

  if(!c) return '';
  const cm = CAT_MAP[c.category] || {label:c.category, icon:'📌'};
  const sm = STATUS_META[c.status] || STATUS_META.new;
  const updates = (c.updates||[]).map((u,i)=>({...u, _idx:i})).sort((a,b)=> new Date(a.timestamp)-new Date(b.timestamp));

        <div class="star-row">${[1,2,3,4,5].map(n=>`<button type="button" class="star-btn" data-action="select-rating" data-value="${n}" aria-label="${n} ดาว">${n<=rv?'★':'☆'}</button>`).join('')}</div>

        ${state.errors.rating ? `<div class="form-error">${escapeHtml(state.errors.rating)}</div>` : ''}
        <button class="btn btn-primary" style="width:100%; margin-top:12px;" data-action="submit-rating" data-id="${c.id}">✅ ยืนยันว่าหายแล้ว พร้อมให้คะแนน</button>

      <div class="reply-box" style="text-align:center;">
        <div class="field-label" style="text-align:center;">คุณให้คะแนนไปแล้ว</div>
        <div class="star-row static">${[1,2,3,4,5].map(n=>`<span>${n<=c.rating?'★':'☆'}</span>`).join('')}</div>
        ${c.feedback ? `<div class="desc-box" style="margin-top:8px; text-align:right;">${escapeHtml(c.feedback)}</div>` : ''}
      </div>
      <div style="text-align:center; margin-top:10px;">
        <button class="small-link" data-action="reopen-case" data-id="${c.id}">⚠️ ปัญหากลับมาอีก? แจ้งเจ้าหน้าที่</button>

    }
    replyBlock = `${quickActions}
      <div class="reply-box">
        <label class="field-label" for="updateText">เพิ่มความคิดเห็นหรือรายละเอียดเพิ่มเติม</label>
        <textarea id="updateText" class="text-input" rows="3" placeholder="พิมพ์ข้อความถึงเจ้าหน้าที่...">${escapeHtml(draftUpdate.text||'')}</textarea>
        ${imagePreviewStrip(draftUpdate.images,'update')}
        ${draftUpdate.images.length<4 ? `<label class="attach-btn">📷 แนบรูป<input type="file" accept="image/*" multiple data-target="update"/></label>` : ''}
        ${state.errors.update ? `<div class="form-error">${escapeHtml(state.errors.update)}</div>` : ''}
        <button class="btn btn-primary" style="width:100%; margin-top:12px;" data-action="submit-update" data-id="${c.id}" data-role="reporter">ส่งความคิดเห็น</button>
      </div>`;
  } else {
    const cur = draftUpdate.status || c.status;
    replyBlock = `<div class="reply-box">
        <label class="field-label">อัปเดตสถานะ</label>
        <div class="status-select-row">${['new','in_progress','done'].map(s=>`<button type="button" class="status-opt sel-${s} ${cur===s?'active':''}" data-action="select-status" data-status="${s}">${STATUS_META[s].icon} ${STATUS_META[s].label}</button>`).join('')}</div>
        <label class="field-label" for="updateText">บันทึกความคืบหน้า</label>
        <textarea id="updateText" class="text-input" rows="3" placeholder="เช่น ส่งช่างไปตรวจแล้ว คาดว่าจะเสร็จวันพรุ่งนี้">${escapeHtml(draftUpdate.text||'')}</textarea>

      <div style="margin-top:18px; text-align:center;">
        <button class="btn btn-ghost" style="width:100%;" data-action="toggle-hide-case" data-id="${c.id}">${c.hidden ? '👁️ เลิกซ่อนเคสนี้' : '🙈 ซ่อนเคสนี้จากรายการ'}</button>
        <div style="font-size:12px; color:var(--ink-faint); margin-top:6px;">ซ่อนแล้วข้อมูลและสถิติจะยังอยู่ครบ แค่ไม่โผล่ในรายการหลัก ติ๊ก "แสดงเคสที่ซ่อนไว้ด้วย" เพื่อดูอีกครั้ง</div>
        ${state.confirmDeleteId===c.id
          ? `<div class="form-error" style="margin:10px 0 8px;">ลบถาวรจะเอาเคสนี้ออกจากสถิติด้วย และกู้คืนไม่ได้ ยืนยันลบจริงไหม?</div>

      </div>`;
  }
  return `
  <div class="overlay">
    <div class="detail-header">
      <button class="back-btn" data-action="close-detail" aria-label="ปิด">←</button>
      <div class="detail-cat">${cm.icon}</div>
      <div style="flex:1;">
        <div class="detail-title">${escapeHtml(c.title)}</div>
        <div class="detail-sub">${cm.label}${c.location?' · '+escapeHtml(c.location):''}${role==='staff'?' · แจ้งโดย '+escapeHtml(c.reporterName):''}${c.assignedTo?' · ดูแลโดย '+escapeHtml(c.assignedTo):''}</div>
        <div style="margin-top:6px;"><span class="status-badge ${sm.cls}">${sm.icon} ${sm.label}</span></div>
      </div>
    </div>
    <div class="content">
      <div class="section-title">รายละเอียดที่แจ้ง</div>
      <div class="desc-box">${escapeHtml(c.description)}</div>
      ${originalImagesBlock(c, role)}
      <div class="detail-sub" style="margin-top:8px;">แจ้งเมื่อ ${fullDate(c.createdAt)}</div>
      ${role==='staff' ? assignmentBlock(c) : ''}
      <div class="section-title">อัปเดตความคืบหน้า</div>
      ${updatesHtml}
      ${replyBlock}
      ${role==='staff' ? internalNotesBlock(c) : ''}
    </div>
    <div class="bottom-space"></div>
  </div>`;
}

/* ============ Actions ============ */
async function handleAction(action, el){
  if(action==='submit-name'){
    const val = document.getElementById('nameInput').value.trim();
    if(!val){ state.errors.onboard='กรอกชื่อก่อนนะ'; render(); return; }
    state.errors.onboard=null;
    saveMe(val);
    state.screen='home'; render(); return;
  }
  if(action==='change-name'){
    localStorage.removeItem('bbkung_me');
    state.me=null; state.screen='onboarding'; render(); return;
  }
  if(action==='enter-reporter'){
    state.screen='reporter'; state.reporterTab='new'; state.justSubmitted=false; draftReport={category:'',images:[]};
    render(); startCasesListener(); return;
  }
  if(action==='enter-staff'){
    if(isStaffUnlocked()){ state.screen='staff'; render(); startCasesListener(); }
    else { state.screen='staffpin'; render(); }
    return;
  }
  if(action==='go-analytics'){ state.screen='analytics'; render(); return; }
  if(action==='go-staff'){ state.screen='staff'; render(); return; }
  if(action==='set-trend-mode'){ state.trendMode = el.dataset.mode; render(); return; }
  if(action==='submit-pin'){
    const val = document.getElementById('pinInput').value;
    if(val===STAFF_PIN){
      sessionStorage.setItem('bbkung_staff_ok','1');
      state.errors.pin=null; state.screen='staff'; render(); startCasesListener();
    } else {
      state.errors.pin='รหัสผ่านไม่ถูกต้อง ลองใหม่อีกครั้ง'; render();
    }
    return;
  }
  if(action==='view-image'){ state.viewingImage = el.dataset.src; render(); return; }
  if(action==='close-image'){ state.viewingImage = null; render(); return; }
  if(action==='noop'){ return; }
  if(action==='go-home'){ state.screen='home'; state.activeCaseId=null; render(); return; }
  if(action==='reporter-tab'){ state.reporterTab = el.dataset.tab; if(state.reporterTab==='new'){ state.justSubmitted=false; } render(); return; }
  if(action==='goto-mine'){ state.reporterTab='mine'; state.justSubmitted=false; render(); return; }
  if(action==='select-category'){ if(el.dataset.target==='report') draftReport.category = el.dataset.cat; render(); return; }
  if(action==='remove-image'){
    const t = el.dataset.target;
    const draft = t==='report' ? draftReport : t==='editImages' ? draftImageEdit : draftUpdate;
    if(!draft) return;
    draft.images.splice(parseInt(el.dataset.idx,10),1);
    render(); return;
  }
  if(action==='reporter-filter-status'){ state.reporterFilter.status = el.dataset.status; render(); return; }
  if(action==='toggle-mine-only'){ state.staffFilter.mineOnly = el.checked; render(); return; }
  if(action==='export-csv'){ exportCasesToCSV(filteredStaffCases()); return; }
  if(action==='assign-to-me'){
    const id = el.dataset.id;
    const c = state.cases.find(x=>x.id===id);
    if(!c) return;
    c.assignedTo = state.me.name; c.assignedAt = new Date().toISOString();
    state.errors.assign = null;
    try{ await saveCase(c); }catch(e){ state.errors.assign='บันทึกไม่สำเร็จ ลองใหม่'; render(); return; }
    showToast('รับเคสนี้แล้ว'); return;
  }
  if(action==='unassign-case'){
    const id = el.dataset.id;
    const c = state.cases.find(x=>x.id===id);
    if(!c) return;
    c.assignedTo = null; c.assignedAt = null;
    state.errors.assign = null;
    try{ await saveCase(c); }catch(e){ state.errors.assign='บันทึกไม่สำเร็จ ลองใหม่'; render(); return; }
    showToast('เลิกมอบหมายแล้ว'); return;
  }
  if(action==='submit-reassign'){
    const id = el.dataset.id;
    const c = state.cases.find(x=>x.id===id);
    if(!c) return;
    const name = (draftReassign && draftReassign.caseId===id ? draftReassign.name : '').trim();
    if(!name){ state.errors.assign='กรอกชื่อก่อนนะ'; render(); return; }
    c.assignedTo = name; c.assignedAt = new Date().toISOString();
    state.errors.assign = null;
    try{ await saveCase(c); }catch(e){ state.errors.assign='บันทึกไม่สำเร็จ ลองใหม่'; render(); return; }
    draftReassign = null;
    showToast('มอบหมายงานแล้ว'); return;
  }
  if(action==='start-edit-images'){
    const id = el.dataset.id;
    const c = state.cases.find(x=>x.id===id);
    if(!c) return;
    draftImageEdit = {caseId: id, images: (c.images||[]).slice()};
    state.errors.editImages = null;
    render(); return;
  }
  if(action==='cancel-edit-images'){ draftImageEdit = null; state.errors.editImages=null; render(); return; }
  if(action==='save-edit-images'){
    const id = el.dataset.id;
    const c = state.cases.find(x=>x.id===id);
    if(!c || !draftImageEdit || draftImageEdit.caseId!==id) return;
    c.images = draftImageEdit.images.slice();
    state.errors.editImages = null;
    try{ await saveCase(c); }catch(e){ state.errors.editImages='บันทึกไม่สำเร็จ ลองใหม่'; render(); return; }
    draftImageEdit = null;
    showToast('บันทึกรูปภาพแล้ว'); return;
  }
  if(action==='submit-internal-note'){
    const id = el.dataset.id;
    const c = state.cases.find(x=>x.id===id);
    if(!c) return;
    const val = document.getElementById('internalNoteText') ? document.getElementById('internalNoteText').value.trim() : draftInternalNote.trim();
    if(!val){ state.errors.internalNote='พิมพ์โน้ตก่อนนะ'; render(); return; }
    c.internalNotes = c.internalNotes || [];
    c.internalNotes.push({by: state.me.name, text: val, timestamp: new Date().toISOString()});
    state.errors.internalNote = null;
    try{ await saveCase(c); }catch(e){ state.errors.internalNote='บันทึกไม่สำเร็จ ลองใหม่'; render(); return; }
    draftInternalNote = '';
    showToast('บันทึกโน้ตแล้ว'); return;
  }
  if(action==='delete-internal-note'){
    const id = el.dataset.id;
    const idx = parseInt(el.dataset.idx,10);
    const c = state.cases.find(x=>x.id===id);
    if(!c || !c.internalNotes || !c.internalNotes[idx]) return;
    c.internalNotes.splice(idx,1);
    try{ await saveCase(c); }catch(e){ state.errors.internalNote='ลบไม่สำเร็จ ลองใหม่'; render(); return; }
    showToast('ลบโน้ตแล้ว'); return;
  }
  if(action==='submit-report'){
    draftReport.title = document.getElementById('reportTitle').value.trim();
    draftReport.location = document.getElementById('reportLocation').value.trim();
    draftReport.description = document.getElementById('reportDesc').value.trim();
    if(!draftReport.title || !draftReport.category || !draftReport.description){
      state.errors.report='กรอกหัวข้อ เลือกหมวดหมู่ และอธิบายรายละเอียดก่อนส่งนะ'; render(); return;
    }
    state.errors.report=null; state.submitting=true; render();
    const c = {
      id: genId(), title: draftReport.title, category: draftReport.category, location: draftReport.location,
      description: draftReport.description, images: draftReport.images.slice(),
      reporterId: state.me.id, reporterName: state.me.name, status:'new',
      createdAt: new Date().toISOString(), updates: []
    };
    try{
      await saveCase(c);
      draftReport={category:'',images:[]};
      state.justSubmitted=true;
      showToast('ส่งเรื่องสำเร็จแล้ว!');
    }catch(e){ state.errors.report='ส่งเรื่องไม่สำเร็จ ตรวจสอบการตั้งค่า Firebase หรือลองใหม่'; }
    state.submitting=false; render(); return;
  }
  if(action==='open-case'){
    state.activeCaseId = el.dataset.id;
    const c = state.cases.find(x=>x.id===state.activeCaseId);
    draftUpdate = {text:'', images:[], status: c?c.status:null};
    draftRating = {value:0, text:''};
    state.editingUpdateIdx = null; draftEditText='';
    draftImageEdit = null; draftReassign = null; draftInternalNote = '';
    state.errors.update=null; state.errors.rating=null; state.errors.editUpdate=null;
    state.errors.assign=null; state.errors.editImages=null; state.errors.internalNote=null;
    state.confirmDeleteId=null; render(); return;
  }
  if(action==='edit-update'){
    const id = el.dataset.id;
    const idx = parseInt(el.dataset.idx,10);
    const c = state.cases.find(x=>x.id===id);
    if(!c || !c.updates || !c.updates[idx]) return;
    state.editingUpdateIdx = idx;
    draftEditText = c.updates[idx].text || '';
    state.errors.editUpdate = null;
    render(); return;
  }
  if(action==='cancel-edit-update'){
    state.editingUpdateIdx = null; draftEditText=''; state.errors.editUpdate=null; render(); return;
  }
  if(action==='save-edit-update'){
    const id = el.dataset.id;
    const idx = parseInt(el.dataset.idx,10);
    const c = state.cases.find(x=>x.id===id);
    if(!c || !c.updates || !c.updates[idx]) return;
    const u = c.updates[idx];
    if(u.role==='reporter'){
      const withinWindow = (Date.now() - new Date(u.timestamp).getTime()) <= REPORTER_EDIT_WINDOW_MS;
      if(!state.me || u.reporterId!==state.me.id || !withinWindow){
        state.editingUpdateIdx = null; draftEditText=''; render(); return;
      }
    }
    const val = draftEditText.trim();
    if(!val && !(u.images && u.images.length)){ state.errors.editUpdate='ข้อความต้องไม่ว่างนะ'; render(); return; }
    u.text = val;
    u.editedAt = new Date().toISOString();
    state.errors.editUpdate = null;
    try{ await saveCase(c); }catch(e){ state.errors.editUpdate='บันทึกไม่สำเร็จ ลองใหม่'; render(); return; }
    state.editingUpdateIdx = null; draftEditText='';
    showToast('แก้ไขข้อความแล้ว'); return;
  }
  if(action==='select-rating'){ draftRating.value = parseInt(el.dataset.value,10); render(); return; }
  if(action==='submit-rating'){
    const id = el.dataset.id;
    const idx = state.cases.findIndex(x=>x.id===id);
    if(idx===-1) return;
    if(draftRating.value<1){ state.errors.rating='กรุณาเลือกดาวให้คะแนนก่อนนะ'; render(); return; }
    const c = state.cases[idx];
    c.rating = draftRating.value;
    c.feedback = draftRating.text ? draftRating.text.trim() : '';
    c.ratedAt = new Date().toISOString();
    c.updates = c.updates || [];
    c.updates.push({
      by: state.me.name, role:'reporter',
      text: 'ยืนยันว่าปัญหาได้รับการแก้ไขเรียบร้อยแล้ว ให้คะแนน '+c.rating+'/5 ดาว'+(c.feedback?('\nข้อเสนอแนะ: '+c.feedback):''),
      images:[], timestamp:new Date().toISOString()
    });
    state.errors.rating=null;
    try{ await saveCase(c); }catch(e){ state.errors.rating='บันทึกคะแนนไม่สำเร็จ ลองใหม่'; render(); return; }
    draftRating = {value:0, text:''};
    showToast('ขอบคุณสำหรับคะแนน! ⭐'); return;
  }
  if(action==='close-detail'){ state.activeCaseId=null; state.confirmDeleteId=null; state.editingUpdateIdx=null; draftEditText=''; draftImageEdit=null; draftReassign=null; draftInternalNote=''; render(); return; }
  if(action==='toggle-show-hidden'){ state.staffFilter.showHidden = el.checked; render(); return; }
  if(action==='toggle-hide-case'){
    const id = el.dataset.id;
    const idx = state.cases.findIndex(x=>x.id===id);
    if(idx===-1) return;
    const c = state.cases[idx];
    c.hidden = !c.hidden;
    try{ await saveCase(c); }catch(e){ c.hidden = !c.hidden; state.errors.update='บันทึกไม่สำเร็จ ลองใหม่'; render(); return; }
    showToast(c.hidden ? 'ซ่อนเคสแล้ว' : 'เลิกซ่อนเคสแล้ว'); return;
  }
  if(action==='ask-delete'){ state.confirmDeleteId = el.dataset.id; render(); return; }
  if(action==='cancel-delete'){ state.confirmDeleteId = null; render(); return; }
  if(action==='confirm-delete'){
    const id = el.dataset.id;
    try{ await deleteCaseDoc(id); }catch(e){ state.errors.update='ลบไม่สำเร็จ ลองใหม่'; render(); return; }
    state.confirmDeleteId=null; state.activeCaseId=null;
    showToast('ลบเคสแล้ว'); return;
  }
  if(action==='select-status'){ draftUpdate.status = el.dataset.status; render(); return; }
  if(action==='staff-filter-status'){ state.staffFilter.status = el.dataset.status; render(); return; }
  if(action==='staff-filter-cat'){ state.staffFilter.category = el.dataset.cat; render(); return; }
  if(action==='submit-update' || action==='confirm-fixed' || action==='reopen-case'){
    const id = el.dataset.id;
    const idx = state.cases.findIndex(x=>x.id===id);
    if(idx===-1) return;
    const c = state.cases[idx];
    let update;
    if(action==='confirm-fixed'){
      update = {by: state.me.name, role:'reporter', text:'ยืนยันว่าปัญหาได้รับการแก้ไขเรียบร้อยแล้ว ขอบคุณค่ะ/ครับ', images:[], timestamp:new Date().toISOString()};
    } else if(action==='reopen-case'){
      update = {by: state.me.name, role:'reporter', text:'แจ้งว่ายังไม่เรียบร้อยดี รบกวนตรวจสอบอีกครั้ง', images:[], timestamp:new Date().toISOString()};
      c.status='in_progress';
    } else {
      const role = el.dataset.role;
      const text = document.getElementById('updateText') ? document.getElementById('updateText').value.trim() : draftUpdate.text.trim();
      if(!text && draftUpdate.images.length===0){ state.errors.update='เขียนข้อความหรือแนบรูปก่อนนะ'; render(); return; }
      update = {by: state.me.name, role, text, images: draftUpdate.images.slice(), timestamp:new Date().toISOString()};
      if(role==='reporter') update.reporterId = state.me.id;
      if(role==='staff' && draftUpdate.status){
        c.status = draftUpdate.status;
        if(draftUpdate.status==='done') c.resolvedBy = state.me.name;
      }
    }
    c.updates = c.updates || [];
    c.updates.push(update);
    state.errors.update=null;
    try{ await saveCase(c); }catch(e){ state.errors.update='บันทึกไม่สำเร็จ ลองใหม่'; render(); return; }
    draftUpdate = {text:'', images:[], status:c.status};
    const toastMsg = action==='confirm-fixed' ? 'ยืนยันเรียบร้อยแล้ว ขอบคุณค่ะ/ครับ'
      : action==='reopen-case' ? 'แจ้งเจ้าหน้าที่อีกครั้งแล้ว'
      : (el.dataset.role==='staff' ? 'บันทึกอัปเดตแล้ว' : 'ส่งความคิดเห็นแล้ว');
    showToast(toastMsg); return;
  }
}
async function handleFileInput(input){
  const target = input.dataset.target;
  const files = Array.from(input.files || []);
  if(!files.length) return;
  const draft = target==='report' ? draftReport : target==='editImages' ? draftImageEdit : draftUpdate;
  if(!draft) return;
  const room = Math.max(4 - draft.images.length, 0);
  const toProcess = files.slice(0, room);
  for(const f of toProcess){
    try{ const dataUrl = await resizeImage(f); draft.images.push(dataUrl); }catch(e){}
  }
  render();
}

/* ============ Event wiring ============ */
document.getElementById('app').addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  handleAction(el.dataset.action, el);
});
document.getElementById('app').addEventListener('change', (e)=>{
  if(e.target.matches('input[type=file]')) handleFileInput(e.target);
});
document.getElementById('app').addEventListener('input', (e)=>{
  const t = e.target;
  if(t.id==='reportTitle') draftReport.title = t.value;
  else if(t.id==='reportLocation') draftReport.location = t.value;
  else if(t.id==='reportDesc') draftReport.description = t.value;
  else if(t.id==='updateText') draftUpdate.text = t.value;
  else if(t.id==='editUpdateText') draftEditText = t.value;
  else if(t.id==='ratingText') draftRating.text = t.value;
  else if(t.id==='staffSearch'){ state.staffFilter.q = t.value; render(); }
  else if(t.id==='myCasesSearch'){ state.reporterFilter.q = t.value; render(); }
  else if(t.id==='reassignInput'){ draftReassign = {caseId: t.dataset.id, name: t.value}; }
  else if(t.id==='internalNoteText') draftInternalNote = t.value;
});

/* ============ Init ============ */
loadMe();
render();
setInterval(()=>{ if(state.activeCaseId) render(); }, 20000);
</script>
